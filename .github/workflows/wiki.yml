name: Wiki

# Publishes docs/wiki to the GitHub wiki. The wiki repository exists only after its first page is
# created in the GitHub UI (any text; it is overwritten here).
on:
  push:
    branches: ["main", "master", "claude/trusting-cray-o8asw8"]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync docs/wiki to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::warning::The wiki is not initialized. Create its first page in the GitHub UI, then re-run this workflow."
            exit 0
          fi
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki is up to date"; exit 0; fi
          git commit -m "docs: sync from ${GITHUB_SHA::7}"
          git push
