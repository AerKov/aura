name: Release

# Push a tag like v0.9.0 to build installers for macOS, Windows and Linux into a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux packages for Tauri
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run build:sidecar
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --config src-tauri/tauri.sidecar.conf.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Aura ${{ github.ref_name }}
          releaseBody: |
            Unsigned proof-of-concept builds. On macOS, right-click the app and choose Open the first
            time; on Windows, choose "More info" → "Run anyway". See the wiki for getting started.
          releaseDraft: true
          prerelease: true
