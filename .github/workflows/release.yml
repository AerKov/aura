name: Release

# Push a tag like v0.17.0-alpha.1 to build installers for macOS, Windows and Linux into a draft
# pre-release. Run it by hand with a tag name for the same (the tag is created when the release is
# published), or without one for a dry run: installers become artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.17.0-alpha.1 (empty: dry run)"
        required: false
        default: ""

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux packages for Tauri
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run build:sidecar
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --config src-tauri/tauri.sidecar.conf.json
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Aura ${{ env.RELEASE_TAG }}
          releaseBody: |
            Alpha build. Read the [alpha notes](https://github.com/AerKov/aura/blob/${{ github.sha }}/docs/ALPHA.md)
            first: requirements, what is optional, and known limits. Changes: [CHANGELOG](https://github.com/AerKov/aura/blob/${{ github.sha }}/CHANGELOG.md).

            The installers are not signed yet. On macOS, right-click the app and choose Open the
            first time; on Windows, choose "More info" → "Run anyway".
          releaseDraft: true
          prerelease: true
      - name: Keep installers of a dry run
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: aura-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
