version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    # Major versions of the stack (TypeScript, Elysia, SDKs) are migrated deliberately, not by bot.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
