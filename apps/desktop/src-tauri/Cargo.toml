[package]
name = "aura-desktop"
version = "0.42.0"
description = "Aura desktop shell"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "aura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
